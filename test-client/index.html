<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Android Screen Stream</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: #e0e0e0;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      font-weight: 300;
      letter-spacing: 2px;
      color: #00d4ff;
      text-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
    }
    .container {
      background: rgba(255, 255, 255, 0.05);
      border-radius: 20px;
      padding: 20px;
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }
    #video {
      width: 360px;
      height: 640px;
      border-radius: 12px;
      background: #000;
      object-fit: contain;
    }
    .status {
      margin-top: 15px;
      padding: 10px 20px;
      border-radius: 8px;
      font-size: 14px;
      text-align: center;
    }
    .status.connecting {
      background: rgba(255, 193, 7, 0.2);
      color: #ffc107;
    }
    .status.connected {
      background: rgba(76, 175, 80, 0.2);
      color: #4caf50;
    }
    .status.error {
      background: rgba(244, 67, 54, 0.2);
      color: #f44336;
    }
    .info {
      margin-top: 10px;
      font-size: 12px;
      color: #888;
    }
    .controls {
      margin-top: 20px;
      width: 100%;
      max-width: 360px;
    }
    .input-section {
      margin-bottom: 15px;
      padding: 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .input-section h3 {
      margin: 0 0 8px 0;
      font-size: 14px;
      font-weight: 600;
      color: #00d4ff;
    }
    .input-section p {
      margin: 0 0 10px 0;
      font-size: 12px;
      color: #ccc;
    }
    #textInput {
      width: 70%;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.3);
      color: #fff;
      font-size: 14px;
      opacity: 0.5;
    }
    #textInput:disabled {
      cursor: not-allowed;
    }
    #textInput::placeholder {
      color: #888;
    }
    button {
      padding: 8px 12px;
      border: none;
      border-radius: 4px;
      background: #00d4ff;
      color: #000;
      font-size: 14px;
      cursor: pointer;
      margin-left: 5px;
      opacity: 0.5;
    }
    button:disabled {
      cursor: not-allowed;
    }
    button:not(:disabled) {
      opacity: 1;
    }
    button:hover {
      background: #0099cc;
    }
    .key-buttons {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    .key-buttons button {
      font-size: 12px;
      padding: 6px 8px;
    }
  </style>
</head>
<body>

<h1>📱 Android Stream</h1>

<div class="container">
  <video id="video" autoplay playsinline muted></video>
  <div id="status" class="status connecting">Connecting...</div>
  <div id="info" class="info"></div>

  <!-- Input Controls -->
  <div class="controls">
    <div class="input-section">
      <h3>📱 Touch Controls</h3>
      <p>Click/tap on the video to send touch events</p>
    </div>

    <div class="input-section">
      <h3>⌨️ Keyboard Input</h3>
      <input type="text" id="textInput" placeholder="Type text to send..." maxlength="100">
      <button onclick="sendText()">Send Text</button>
    </div>

    <div class="input-section">
      <h3>🔘 Common Keys</h3>
      <div class="key-buttons">
        <!-- Android keycodes: https://developer.android.com/reference/android/view/KeyEvent -->
        <button onclick="sendKey(3)">Home</button>
        <button onclick="sendKey(4)">Back</button>
        <button onclick="sendKey(82)">Menu</button>
        <button onclick="sendKey(66)">Enter</button>
        <button onclick="sendKey(24)">Vol+</button>
        <button onclick="sendKey(25)">Vol-</button>
      </div>
    </div>
  </div>
</div>

<script>
const statusEl = document.getElementById('status');
const infoEl = document.getElementById('info');
const videoEl = document.getElementById('video');
let inputChannel = null;

function setStatus(text, type) {
  statusEl.textContent = text;
  statusEl.className = 'status ' + type;
}

function setInfo(text) {
  infoEl.textContent = text;
}

async function start() {
  try {
    setStatus('Creating WebRTC connection...', 'connecting');

    const pc = new RTCPeerConnection({
      // No ICE servers needed for local testing - using direct UDP
    });

    // Add video transceiver to receive video
    pc.addTransceiver("video", { direction: "recvonly" });

    // Handle incoming track
    pc.ontrack = (event) => {
      console.log('Track received:', event.track.kind);
      setStatus('Video track received', 'connected');

      if (event.streams && event.streams[0]) {
        videoEl.srcObject = event.streams[0];
        console.log('Stream attached to video element');
      }
    };

    // Create input data channel from client side
    console.log('Creating input data channel from client...');
    inputChannel = pc.createDataChannel('input', {
      ordered: false, // unordered for lower latency
    });

    inputChannel.onopen = () => {
      console.log('✅ Client-created input channel opened, state:', inputChannel.readyState);
      setInfo('Input controls active ✅');
      // Enable input controls
      document.querySelectorAll('.input-section button, #textInput').forEach(el => {
        el.disabled = false;
        el.style.opacity = '1';
      });
      videoEl.style.cursor = 'crosshair';
    };

    inputChannel.onclose = () => {
      console.log('❌ Client-created input channel closed');
      setInfo('Input controls disabled');
      inputChannel = null;
      // Disable input controls
      document.querySelectorAll('.input-section button, #textInput').forEach(el => {
        el.disabled = true;
        el.style.opacity = '0.5';
      });
      videoEl.style.cursor = 'default';
    };

    inputChannel.onerror = (error) => {
      console.error('❌ Client-created input channel error:', error);
    };

    inputChannel.onmessage = (event) => {
      console.log('📨 Client received message:', event.data);
    };

    console.log('📝 Client input channel created, initial state:', inputChannel.readyState);

    // Also listen for server-created channels (fallback)
    pc.ondatachannel = (event) => {
      const channel = event.channel;
      console.log('🔗 Data channel received:', channel.label, 'state:', channel.readyState);

      if (channel.label === 'input') {
        inputChannel = channel;
        console.log('📝 Assigned input channel, current state:', inputChannel.readyState);

        inputChannel.onopen = () => {
          console.log('✅ Input channel opened, state:', inputChannel.readyState);
          setInfo('Input controls active ✅');
          // Enable input controls
          document.querySelectorAll('.input-section button, #textInput').forEach(el => {
            el.disabled = false;
            el.style.opacity = '1';
          });
          videoEl.style.cursor = 'crosshair';
        };
        inputChannel.onclose = () => {
          console.log('❌ Input channel closed');
          setInfo('Input controls disabled');
          inputChannel = null;
          // Disable input controls
          document.querySelectorAll('.input-section button, #textInput').forEach(el => {
            el.disabled = true;
            el.style.opacity = '0.5';
          });
          videoEl.style.cursor = 'default';
        };
        inputChannel.onerror = (error) => {
          console.error('❌ Input channel error:', error);
        };
        inputChannel.onmessage = (event) => {
          console.log('📨 Received message:', event.data);
        };

        // Check state immediately
        console.log('📊 Input channel initial state:', inputChannel.readyState);
      }
    };

    // Monitor connection state
    pc.onconnectionstatechange = () => {
      console.log('Connection state:', pc.connectionState);
      setInfo('Connection: ' + pc.connectionState);
      
      if (pc.connectionState === 'connected') {
        setStatus('Connected & Streaming', 'connected');
      } else if (pc.connectionState === 'failed' || pc.connectionState === 'disconnected') {
        setStatus('Connection ' + pc.connectionState, 'error');
      }
    };

    pc.oniceconnectionstatechange = () => {
      console.log('ICE state:', pc.iceConnectionState);
    };

    // Create offer
    const offer = await pc.createOffer({ offerToReceiveVideo: true });
    await pc.setLocalDescription(offer);
    console.log('Local description set');

    // Wait for ICE gathering to complete
    setStatus('Gathering ICE candidates...', 'connecting');
    await new Promise((resolve, reject) => {
      const timeout = setTimeout(() => {
        console.log('ICE gathering timeout, proceeding anyway');
        resolve();
      }, 5000);

      if (pc.iceGatheringState === "complete") {
        clearTimeout(timeout);
        resolve();
      } else {
        pc.addEventListener("icegatheringstatechange", () => {
          if (pc.iceGatheringState === "complete") {
            clearTimeout(timeout);
            resolve();
          }
        });
      }
    });

    console.log('ICE gathering complete');
    setStatus('Sending offer to server...', 'connecting');

    // Send offer to server (use relative URL or current host)
    const serverUrl = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1'
      ? 'http://localhost:8080/offer'
      : `http://localhost:8080/offer`;

    console.log('Sending offer to:', serverUrl);

    const res = await fetch(serverUrl, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(pc.localDescription)
    });

    if (!res.ok) {
      throw new Error(`Server returned ${res.status}: ${await res.text()}`);
    }

    const answer = await res.json();
    console.log('Received answer from server');

    await pc.setRemoteDescription(answer);
    console.log('Remote description set');

    setStatus('Waiting for video stream...', 'connecting');

  } catch (err) {
    console.error('WebRTC error:', err);
    setStatus('Error: ' + err.message, 'error');
  }
}

// Input control functions
function sendCommand(cmd) {
  if (inputChannel && inputChannel.readyState === 'open') {
    inputChannel.send(cmd);
    console.log('Sent command:', cmd);
  } else {
    console.warn('Input channel not ready, state:', inputChannel ? inputChannel.readyState : 'null');
    // Retry after a short delay if connecting
    if (inputChannel && inputChannel.readyState === 'connecting') {
      setTimeout(() => sendCommand(cmd), 100);
    }
  }
}

function sendText() {
  const input = document.getElementById('textInput');
  if (input.value.trim()) {
    sendCommand('text:' + input.value.trim());
    input.value = '';
  }
}

function sendKey(keyCode) {
  sendCommand('key:' + keyCode);
}

// Handle keyboard input
document.getElementById('textInput').addEventListener('keypress', (e) => {
  if (e.key === 'Enter') {
    sendText();
  }
});

// Handle touch and mouse events on video
let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let isDragging = false;
const minSwipeDistance = 50; // Minimum distance for swipe detection
const maxTapDuration = 300; // Maximum duration for tap vs swipe

function getScaledCoordinates(clientX, clientY) {
  const rect = videoEl.getBoundingClientRect();
  const scaleX = videoEl.videoWidth / rect.width;
  const scaleY = videoEl.videoHeight / rect.height;
  return {
    x: Math.round((clientX - rect.left) * scaleX),
    y: Math.round((clientY - rect.top) * scaleY)
  };
}

// Mouse events (for desktop testing)
videoEl.addEventListener('mousedown', (e) => {
  e.preventDefault();
  const coords = getScaledCoordinates(e.clientX, e.clientY);
  touchStartX = coords.x;
  touchStartY = coords.y;
  touchStartTime = Date.now();
  isDragging = false;
});

videoEl.addEventListener('mousemove', (e) => {
  if (e.buttons === 1) { // Left mouse button held
    isDragging = true;
  }
});

videoEl.addEventListener('mouseup', (e) => {
  if (!isDragging) {
    // Simple click/tap
    sendCommand(`touch:${touchStartX}:${touchStartY}`);
    console.log(`Tap at ${touchStartX}, ${touchStartY}`);
  }
  isDragging = false;
});

// Touch events (for mobile devices)
videoEl.addEventListener('touchstart', (e) => {
  e.preventDefault();
  const touch = e.touches[0];
  const coords = getScaledCoordinates(touch.clientX, touch.clientY);
  touchStartX = coords.x;
  touchStartY = coords.y;
  touchStartTime = Date.now();
  isDragging = false;
}, { passive: false });

videoEl.addEventListener('touchmove', (e) => {
  e.preventDefault();
  if (e.touches.length === 1) {
    isDragging = true;
  }
}, { passive: false });

videoEl.addEventListener('touchend', (e) => {
  e.preventDefault();
  const touchDuration = Date.now() - touchStartTime;

  if (!isDragging && touchDuration < maxTapDuration) {
    // Simple tap
    sendCommand(`touch:${touchStartX}:${touchStartY}`);
    console.log(`Tap at ${touchStartX}, ${touchStartY}`);
  } else if (isDragging && e.changedTouches.length === 1) {
    // Swipe gesture
    const touch = e.changedTouches[0];
    const coords = getScaledCoordinates(touch.clientX, touch.clientY);
    const endX = coords.x;
    const endY = coords.y;

    const deltaX = endX - touchStartX;
    const deltaY = endY - touchStartY;
    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

    if (distance > minSwipeDistance) {
      // Calculate swipe duration (minimum 200ms, maximum 1000ms based on distance)
      const swipeDuration = Math.min(1000, Math.max(200, distance * 2));
      sendCommand(`swipe:${touchStartX}:${touchStartY}:${endX}:${endY}:${Math.round(swipeDuration)}`);
      console.log(`Swipe: (${touchStartX},${touchStartY}) -> (${endX},${endY}) in ${swipeDuration}ms`);
    }
  }

  isDragging = false;
}, { passive: false });

// Fallback click handler for older browsers
videoEl.addEventListener('click', (e) => {
  // Only handle if touch events aren't supported or failed
  if (!('ontouchstart' in window)) {
    const coords = getScaledCoordinates(e.clientX, e.clientY);
    sendCommand(`touch:${coords.x}:${coords.y}`);
    console.log(`Fallback click at ${coords.x}, ${coords.y}`);
  }
});

// Auto-start on load
start();

// Handle video element events
videoEl.onloadedmetadata = () => {
  console.log('Video metadata loaded:', videoEl.videoWidth, 'x', videoEl.videoHeight);
  setInfo(`Resolution: ${videoEl.videoWidth}x${videoEl.videoHeight}`);
};

videoEl.onplaying = () => {
  console.log('Video is playing');
  setStatus('✅ Streaming', 'connected');
};

videoEl.onerror = (e) => {
  console.error('Video error:', e);
};
</script>

</body>
</html>
